<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriLink - Customer Registration / Marketplace Access</title>
    <!-- Load Tailwind for modern utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CUSTOM STYLES ALIGNED WITH AGILINK BRANDING --- */
        :root {
            --agri-green: #2e8b57;
            --light-green: #b7e4c7;
            --cream: #f9f7f3;
            --text: #1b4332;
            --shadow: rgba(0, 0, 0, 0.1);
            --customer-accent: #40916c; /* Matching the customer button on index.html */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header (Aligned with Farmer Dashboard) */
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 6px var(--shadow);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header .container {
            width: 90%;
            max-width: 1280px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .logo span {
            color: var(--agri-green);
        }
        
        /* General Button Styling */
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn.customer {
            background: var(--customer-accent);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px var(--shadow);
        }

        /* Authentication Section */
        .auth-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background: var(--light-green); 
        }

        /* Form Container Styles */
        .dashboard-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
        }

        .dashboard-container h3 {
            text-align: center;
            color: var(--agri-green);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .customer-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .customer-form label {
            font-weight: 600;
            color: var(--text);
            text-align: left;
            margin-top: 0.75rem;
        }

        .customer-form input {
            padding: 0.9rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            width: 100%;
            background-color: white;
            color: var(--text);
            transition: 0.3s;
        }

        .customer-form input:focus {
            border-color: var(--agri-green);
            box-shadow: 0 0 6px var(--light-green);
        }

        .customer-form button {
            width: 100%;
            margin-top: 1.5rem;
            font-size: 1rem;
        }
        
        /* Display Card Styles */
        .info-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            background-color: var(--cream);
            border-left: 5px solid var(--customer-accent);
        }

        .info-card div:first-child {
            font-weight: 500;
            color: #555;
        }

        .info-card span {
            font-weight: 700;
            color: var(--text);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 1rem;
            background: white;
            border-top: 1px solid #eee;
            box-shadow: 0 -1px 6px var(--shadow);
            margin-top: auto;
        }

        .footer p {
            font-size: 0.9rem;
            color: #555;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .dashboard-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Agri<span>Link</span></h1>
            <nav class="flex items-center space-x-4">
                <!-- Link back to the main home page -->
                <a href="index.html" class="btn customer px-4 py-2 text-sm shadow-md">← Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Main Content: Registration Section -->
    <section class="auth-section">
        <div class="dashboard-container">
            <h3>🛒 Customer Registration</h3>
            <p class="text-center text-sm text-gray-600">Register to save your delivery address and access the marketplace of fresh produce.</p>
            
            <!-- Form for entering details -->
            <form class="customer-form" id="customerForm">
                
                <div>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" placeholder="Enter your name" required />
                </div>
                
                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required />
                </div>

                <div>
                    <label for="apartment">Apartment / Door Number:</label>
                    <input type="text" id="apartment" placeholder="Enter apartment or door number" required />
                </div>

                <div>
                    <label for="area">Area:</label>
                    <input list="areas" id="area" placeholder="Select your area" required />
                    <datalist id="areas">
                        <option value="Bheemunipatnam"></option>
                        <option value="Ramakrishnapuram"></option>
                        <option value="Anandapuram"></option>
                        <option value="Gajuwaka"></option>
                        <option value="Duvvada"></option>
                        <option value="Pendurthi"></option>
                        <option value="Malkapuram"></option>
                        <option value="Yerpedu"></option>
                    </datalist>
                </div>

                <button type="submit" class="btn customer" id="registerButton">
                    ✅ Save Details & View Marketplace
                </button>
                <p id="saveMessage" class="text-center text-sm mt-3 hidden"></p>
            </form>

            <!-- Display user details after submission -->
            <div id="userDetails" style="margin-top: 2.5rem; display: none;">
                <p style="text-align: center; font-weight: 700; margin-bottom: 1rem; color: var(--customer-accent);">Your Saved Delivery Information:</p>
                <div class="info-card">
                    <div>Name:</div>
                    <div><span id="displayName"></span></div>
                </div>
                <div class="info-card">
                    <div>Phone Number:</div>
                    <div><span id="displayPhone"></span></div>
                </div>
                <div class="info-card">
                    <div>Apartment / Door Number:</div>
                    <div><span id="displayApartment"></span></div>
                </div>
                <div class="info-card">
                    <div>Area:</div>
                    <div><span id="displayArea"></span></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© <span id="year"></span> AgriLink — Empowering Customers</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- Global Variables (Provided by Canvas Environment) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;
        
        // --- Initialization and Authentication ---
        async function initializeFirebase() {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.error("Firebase configuration not available.");
                    return;
                }
                
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                setLogLevel('debug');
                await setPersistence(auth, browserSessionPersistence);
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            userId = user.uid;
                        } else {
                            userId = crypto.randomUUID(); 
                        }
                        console.log("Firebase User ID:", userId);
                        resolve(true);
                    });
                });

            } catch (error) {
                console.error("Error initializing Firebase:", error);
            }
        }

        // --- Data Saving Function (Public Path for Marketplace visibility) ---
        async function saveCustomerDetails(details) {
            if (!db || !userId) {
                console.error("Database not ready or user not authenticated.");
                return false;
            }

            // Public path: /artifacts/{appId}/public/data/customer_profiles/{userId}
            const docRef = doc(db, 
                artifacts/${appId}/public/data/customer_profiles, 
                userId // Use userId as the document ID
            );

            try {
                await setDoc(docRef, {
                    ...details,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });

                return true;

            } catch (error) {
                console.error("Error saving document to Firestore:", error);
                return false;
            }
        }
        
        // --- Local Display Function ---
        function updateLocalDisplay(details) {
            document.getElementById("displayName").textContent = details.name;
            document.getElementById("displayPhone").textContent = details.phone;
            document.getElementById("displayApartment").textContent = details.apartment;
            document.getElementById("displayArea").textContent = details.area;
            document.getElementById("userDetails").style.display = "block";
        }

        // --- Main Logic on Window Load ---
        window.onload = async function() {
            document.getElementById("year").textContent = new Date().getFullYear();
            
            await initializeFirebase();
            
            // Handle form submission
            document.getElementById('customerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const registerButton = document.getElementById('registerButton');
                registerButton.textContent = "Saving...";
                registerButton.disabled = true;

                const name = document.getElementById('name').value;
                const phone = document.getElementById('phone').value;
                const apartment = document.getElementById('apartment').value;
                const area = document.getElementById('area').value;
                const messageElement = document.getElementById('saveMessage');

                const details = { name, phone, apartment, area };

                if (!name || !phone || !apartment || !area) {
                    messageElement.textContent = 'Please fill out all required fields.';
                    messageElement.classList.remove('hidden', 'text-white', 'bg-green-600');
                    messageElement.classList.add('text-red-500', 'p-2', 'bg-red-100', 'rounded-lg');
                    registerButton.textContent = "✅ Save Details & View Marketplace";
                    registerButton.disabled = false;
                    setTimeout(() => { messageElement.classList.add('hidden'); }, 5000);
                    return;
                }

                const success = await saveCustomerDetails(details);

                if (success) {
                    messageElement.textContent = Success! Your profile is saved for marketplace access.;
                    messageElement.classList.remove('hidden', 'text-red-500', 'bg-red-100');
                    messageElement.classList.add('text-white', 'p-2', 'bg-green-600', 'rounded-lg');
                    updateLocalDisplay(details); // Show the saved details
                } else {
                    messageElement.textContent = 'Error saving data. Please try again.';
                    messageElement.classList.remove('hidden', 'text-white', 'bg-green-600');
                    messageElement.classList.add('text-red-500', 'p-2', 'bg-red-100', 'rounded-lg');
                }

                registerButton.textContent = "✅ Save Details & View Marketplace";
                registerButton.disabled = false;
                
                setTimeout(() => { messageElement.classList.add('hidden'); }, 5000);
            });
        }
    </script>
</body>
</html>
